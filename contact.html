<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JO FF Clan | التواصل</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container navbar">
      <div class="brand">
        <div class="brand-badge">💬</div>
        <span>JO FF Clan</span>
      </div>
<nav class="nav-links">

  <a href="intro.html" data-i18n="nav_intro">
    <span class="nav-icon">🏠</span>
    <span>المقدمة</span>
  </a>

  <a href="clan.html" data-i18n="nav_clan">
    <span class="nav-icon">👥</span>
    <span>عن الكلان</span>
  </a>

  <a href="competitions.html" data-i18n="nav_competitions">
    <span class="nav-icon">🏆</span>
    <span>المسابقات</span>
  </a>

  <a href="contact.html" data-i18n="nav_contact">
    <span class="nav-icon">💬</span>
    <span>التواصل</span>
  </a>

  <a href="accounts.html" data-i18n="nav_market">
    <span class="nav-icon">📦</span>
    <span>الحسابات</span>
  </a>

  <a href="links.html" data-i18n="nav_links">
    <span class="nav-icon">🔗</span>
    <span>الروابط</span>
  </a>

    <a href="player.html">
  <span class="nav-icon">🎮</span>
  <span>اللاعبين</span>
</a>

</nav>
      <div class="control-group">
        <button id="themeToggle" class="btn secondary small" type="button">الوضع الليلي</button>
        <button id="langToggle" class="btn secondary small" type="button">EN</button>
      </div>
    </div>
  </header>

  <main class="container hero">
    <section class="grid-2">
      <div class="panel">
        <div class="section-head">
          <h2 data-i18n="contacts_title">تواصل مع الإداريين</h2>
          <span class="badge">24/7</span>
        </div>
        <div class="list" style="margin-bottom: 16px;">
          <div class="list-item">القائد: كزبره شخصيا</div>
          <div class="list-item">قائد بنيابة : كزبرة شخصيا</div>
          <div class="list-item">الزعيم 1: بطيخ</div>
          <div class="list-item">الزعيم 2: بطيخ</div>
          <div class="list-item">الزعيم 3: بطيخ</div>
        </div>
        <form id="contactForm">
          <label>الاسم</label>
          <input class="input" id="senderName" type="text" placeholder="اسمك" />

          <label>اختر الشخص المراد التواصل معه</label>
          <select id="contactTo">
            <option value="القائد">القائد</option>
            <option value="بنيابة الزعيم 1">بنيابة الزعيم 1</option>
            <option value="بنيابة الزعيم 2">بنيابة الزعيم 2</option>
            <option value="بنيابة الزعيم 3">بنيابة الزعيم 3</option>
          </select>

          <label>الرسالة</label>
          <textarea id="messageText" rows="5" placeholder="اكتب رسالتك هنا..."></textarea>

          <button class="btn" type="submit">إرسال الرسالة</button>
          <div id="contactStatus" class="status"></div>
        </form>
      </div>

      <div class="panel">
        <div class="section-head">
          <h2 data-i18n="contact_message_title">الرسائل المرسلة</h2>
          <span class="badge">Saved</span>
        </div>
        <div id="contactList" class="list"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
