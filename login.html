<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JO FF Clan | تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="pill">جو فاير | JO FF</div>
      <h1>مرحباً بك في الكلان</h1>
      <p class="muted">سجل دخولك لتصفح لوحة الكلان والرسائل والمسابات.</p>

      <form id="loginForm">
        <label>اسم المستخدم</label>
        <input class="input" id="username" type="text" placeholder="اكتب اسمك" />

        <label>كلمة المرور</label>
        <input class="input" id="password" type="password" placeholder="اكتب كلمة المرور" />

        <button class="btn full" type="submit">تسجيل الدخول</button>
        <div id="loginStatus" class="status"></div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
